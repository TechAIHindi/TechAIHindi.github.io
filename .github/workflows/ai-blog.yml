name: AI Blog

on:
  workflow_dispatch:

  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gemini SDK
        run: pip install -U google-genai

      - name: Generate AI Article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from google import genai

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"]
          )

          # पहले से मौजूद articles की list
          existing_articles = []

          if os.path.exists("articles"):
              for filename in os.listdir("articles"):
                  if filename.endswith(".html"):
                      existing_articles.append(filename)

          existing_text = "\n".join(existing_articles[-30:])

          prompt = f"""
          तुम "TechAI Hindi" नाम की हिंदी technology website के लिए
          एक नया और useful beginner-friendly article लिख रहे हो।

          आज की तारीख:
          {datetime.now().strftime("%d %B %Y")}

          विषय:
          AI, Artificial Intelligence, Technology, Mobile Apps,
          Internet, Google, Android, Productivity या Cyber Safety
          से जुड़ा कोई useful topic चुनो।

          ऐसा topic चुनो जो आम भारतीय users के लिए genuinely useful हो।

          इन पुराने articles के topic/title को दोहराने से बचो:
          {existing_text}

          Article requirements:

          - 800 से 1200 शब्द
          - आसान और natural हिंदी
          - Indian audience को ध्यान में रखो
          - SEO friendly
          - शुरुआत में आकर्षक introduction
          - एक मुख्य H1 heading
          - उचित H2 और H3 headings
          - practical examples
          - जरूरी हो तो bullet points
          - जानकारी स्पष्ट और उपयोगी हो
          - अंत में conclusion
          - गलत या मनगढ़ंत facts मत बनाओ
          - किसी website का पूरा content copy मत करो
          - clickbait मत बनाओ

          HTML requirements:

          केवल article का HTML output करो।

          Allowed tags:
          <h1>
          <h2>
          <h3>
          <p>
          <ul>
          <ol>
          <li>
          <strong>
          <em>
          <blockquote>
          <a>

          <html>, <head>, <body>, <style> या <script> tags मत देना।

          Output में Markdown मत देना।
          केवल साफ HTML article देना।
          """

          response = client.models.generate_content(
              model="gemini-3.6-flash",
              contents=prompt
          )

          article = response.text.strip()

          if not article:
              raise RuntimeError("Gemini returned an empty article.")

          # अगर AI ने गलती से markdown code fence डाल दिया हो
          if article.startswith("```html"):
              article = article[7:]

          if article.endswith("```"):
              article = article[:-3]

          article = article.strip()

          os.makedirs("articles", exist_ok=True)

          timestamp = datetime.now().strftime("%Y-%m-%d-%H%M")

          filename = f"articles/ai-article-{timestamp}.html"

          with open(filename, "w", encoding="utf-8") as f:
              f.write(article)

          print("Created:", filename)
          PY

      - name: Publish article
        run: |
          git config user.name "TechAI Hindi AI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add articles/

          if git diff --cached --quiet; then
            echo "No new article was created."
          else
            git commit -m "AI: Publish new article"
            git push
          fi
